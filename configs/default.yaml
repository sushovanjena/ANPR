# ANPR cascade configuration. Weight paths are relative to the repository root.
camera_id: cam0
source: sample.mp4          # RTSP URL, file path or webcam index
live: false                 # true for cameras (wall-clock time, auto-reconnect)
realtime: true              # files only: pace frames at source FPS like a live stream
queue_size: 2               # frames buffered; oldest is dropped when full
max_gap: 45                 # frames without a sighting before a vehicle is "gone"
auto_fetch_weights: true    # download published weights on first use
report_every: 10.0          # seconds between metric log lines

vehicle:
  weights: yolo26n.pt       # COCO-pretrained; no fine-tuning
  conf: 0.3
  imgsz: 640

plate:
  enabled: true             # false = vehicles + tracking only (no plate weights yet)
  kind: rfdetr              # rfdetr | yolo
  weights: weights/plate_rfdetr_nano.pth   # fetched from the release (see docs/WEIGHTS.md)
  conf: 0.3

ocr:
  openocr_dir: third_party/OpenOCR        # cloned automatically
  weights: weights/ocr_repsvtr_v2.pt
  dict_path: weights/plate_dict.txt
  two_line_aspect: 2.6

tracker:
  high_thr: 0.5
  low_thr: 0.1
  match_iou: 0.3
  max_age: 30
  min_hits: 2

gate:
  min_width: 40
  min_height: 12
  min_sharpness: 20.0

consensus:
  settle_reads: 5
  settle_support: 0.8

sinks:
  jsonl: out/events.jsonl
  sqlite: out/events.db
