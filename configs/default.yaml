# ANPR cascade configuration. Paths are examples for the Colab/Drive layout.
camera_id: cam0
source: sample.mp4          # RTSP URL, file path or webcam index
live: false                 # true for cameras (wall-clock time, auto-reconnect)
realtime: true              # files only: pace frames at source FPS like a live stream
queue_size: 2               # frames buffered; oldest is dropped when full
max_gap: 45                 # frames without a sighting before a vehicle is "gone"
report_every: 10.0          # seconds between metric log lines

vehicle:
  weights: yolo26n.pt       # COCO-pretrained; no fine-tuning
  conf: 0.3
  imgsz: 640

plate:
  enabled: true             # false = vehicles + tracking only (no plate weights yet)
  kind: rfdetr              # rfdetr | yolo
  weights: /content/drive/MyDrive/bosch_anpr/models/det_rfdetr_nano_main/checkpoint_best_ema.pth
  conf: 0.3

ocr:
  openocr_dir: /content/OpenOCR
  weights: /content/drive/MyDrive/bosch_anpr/models/ocr_repsvtr_ft_v2/best_ema.pt
  dict_path: /content/drive/MyDrive/bosch_anpr/models/ocr_repsvtr_ft_v2/plate_dict.txt
  two_line_aspect: 2.6

tracker:
  high_thr: 0.5
  low_thr: 0.1
  match_iou: 0.3
  max_age: 30
  min_hits: 2

gate:
  min_width: 40
  min_height: 12
  min_sharpness: 20.0

consensus:
  settle_reads: 5
  settle_support: 0.8

sinks:
  jsonl: out/events.jsonl
  sqlite: out/events.db
