[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr"
version = "0.1.0"
description = "ANPR for Indian traffic scenes, targeting NVIDIA Jetson Orin"
requires-python = ">=3.10"
dependencies = [
  "ultralytics", "opencv-python-headless", "albumentations",
  "numpy", "pandas", "pyyaml", "matplotlib", "seaborn",
  "onnx", "onnxruntime-gpu", "imagehash", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
